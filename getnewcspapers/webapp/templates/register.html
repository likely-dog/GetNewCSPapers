<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>注册</title></head>
<body>
<h3>注册</h3>
{% if error %}<div style="color:red;">{{ error }}</div>{% endif %}
<form method="post" action="/register">
  <div>邮箱：<input name="email" type="email" required></div>
  <div>密码：<input name="password" type="password" required></div>
  <button type="submit">提交</button>
</form>
<div><a href="/login">已有账号，去登录</a></div>
</body>
</html>
